{% extends "base.html" %}{% block body %}<div class="card" style="max-width:520px;margin:2rem auto;text-align:center">
{% if c %}<div class="flash ok">Valid certificate</div><h2>{{ c.student }}</h2><p>participated in <strong>{{ c.title }}</strong><br>{{ c.start_time|fmt }}, {{ c.venue }}</p>
